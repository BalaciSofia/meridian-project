<main class="change-password-page">
  <section class="change-password-card">
    <p class="eyebrow">Temporary password</p>
    <h1>Change your password</h1>
    <p class="subtitle">You need to change your temporary password before continuing.</p>

    <form (ngSubmit)="changePassword()">
      <label>
        Current password
        <input type="password" name="currentPassword" [(ngModel)]="currentPassword" required />
      </label>

      <label>
        New password
        <input type="password" name="newPassword" [(ngModel)]="newPassword" required />
      </label>

      <button type="submit">Change password</button>
    </form>

    @if (errorMessage()) {
      <p class="error-message">{{ errorMessage() }}</p>
    }
  </section>
</main>
